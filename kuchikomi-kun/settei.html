<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>口コミっとくん — 設定ページ</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    .admin{max-width:680px;margin:0 auto;padding:24px 18px 60px}
    .admin h1{font-size:1.3rem;margin:0 0 4px}
    .admin .sub{margin:0 0 18px}
    .sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
    .sec h2{font-size:1rem;margin:0 0 12px;color:var(--accent)}
    label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 5px}
    .hint{font-weight:400;color:var(--sub);font-size:.8rem;margin:2px 0 0}
    input[type=text],input[type=url],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:1rem;font-family:inherit}
    input:focus,textarea:focus{outline:none;border-color:var(--accent)}
    textarea{resize:vertical;min-height:90px;line-height:1.7}
    input[type=color]{width:48px;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;vertical-align:middle}
    .out{background:#f0f2f5;border-radius:10px;padding:12px;word-break:break-all;font-size:.85rem;margin:6px 0}
    #admin-qr{text-align:center;margin:10px 0}
    #admin-qr img{width:220px;height:220px;image-rendering:pixelated}
    .btnrow{display:flex;flex-wrap:wrap;gap:10px}
    .btnrow .btn{width:auto;flex:1;min-width:140px;margin-top:0}
    .ok{color:#1a7f37;font-size:.85rem;min-height:1.1em;margin:6px 0 0}
    @media print{.no-print{display:none}.sec{border:none}}
  </style>
</head>
<body>
  <div class="admin">
    <h1>口コミっとくん 設定ページ</h1>
    <p class="sub">この画面で設定し、生成された<strong>お客様用リンク・QR</strong>を掲示してください。設定はリンクに保存されます（サーバー登録不要）。</p>

    <div class="sec">
      <h2>① 店舗情報</h2>
      <label>店舗名 <span class="hint">画面上部に表示されます</span></label>
      <input type="text" id="f-name" placeholder="例）glab（御徒町）" />

      <label>Google口コミURL（または Place ID）
        <span class="hint">Googleで店名検索 →「クチコミを書く」のリンク。Place IDだけでも可。</span>
      </label>
      <input type="url" id="f-url" placeholder="https://search.google.com/local/writereview?placeid=..." />

      <label>ロゴ表示テキスト（任意）</label>
      <input type="text" id="f-logo" placeholder="例）glab" />

      <label>アクセントカラー（任意）</label>
      <input type="color" id="f-accent" value="#1B2A4A" />
    </div>

    <div class="sec">
      <h2>② 設問・回答（1行に1つ）</h2>
      <label>体験したメニュー <span class="hint">お客様が「どれを体験したか」を選ぶ選択肢</span></label>
      <textarea id="f-exp" placeholder="手作り結婚指輪&#10;手作り婚約指輪&#10;ペアリング作り"></textarea>

      <label>よかった点 <span class="hint">高評価のときに選ぶ選択肢（複数選択）</span></label>
      <textarea id="f-hl" placeholder="スタッフの対応がよかった&#10;雰囲気がよかった&#10;仕上がりに満足"></textarea>

      <label>気になった点 <span class="hint">低評価（星3以下）のときに選ぶ選択肢。空欄なら既定を使用</span></label>
      <textarea id="f-neg" placeholder="待ち時間が長かった&#10;説明がわかりにくかった&#10;料金について"></textarea>

      <label>お礼メッセージ（完了画面）</label>
      <input type="text" id="f-thanks" placeholder="本日はありがとうございました。" />
    </div>

    <div class="sec no-print">
      <h2>③ お客様用リンク・QRを作る</h2>
      <button class="btn btn-primary" id="gen">リンク・QRを作成</button>

      <div id="result" style="display:none">
        <label>お客様用リンク</label>
        <div class="out" id="out-url"></div>
        <div class="btnrow">
          <button class="btn btn-sub" id="copy">リンクをコピー</button>
          <button class="btn btn-sub" id="open">プレビューを開く</button>
        </div>
        <p class="ok" id="msg"></p>

        <div id="admin-qr"></div>
        <button class="btn btn-sub" id="print">QRを印刷</button>

        <label style="margin-top:18px">この設定をあとで編集するためのリンク <span class="hint">ブックマーク推奨</span></label>
        <div class="out" id="out-edit"></div>
        <button class="btn btn-sub" id="copy-edit">編集用リンクをコピー</button>
      </div>
    </div>
  </div>

  <script src="./vendor/qrcode.js"></script>
  <script src="./settei.js"></script>
</body>
</html>
